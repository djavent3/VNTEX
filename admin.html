<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNTEX // Standalone Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { background: #040509; color: #f3f4f8; font-family: 'Inter', sans-serif; margin: 0; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
    .admin-card { background: #0a0c14; border: 1px solid #1c2033; border-radius: 1rem; }
    .admin-well { background: #05060b; border: 1px solid #181b2c; border-radius: 0.75rem; color: #ffffff; }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
  <div id="adminLoginGate" class="max-w-md mx-auto mt-20 admin-card p-7 space-y-4">
    <h1 class="text-sm font-extrabold uppercase font-mono-tech text-amber-400">VNTEX Standalone Admin Portal</h1>
    <p class="text-xs text-gray-400 font-mono-tech">Login: admin@vntex.io / admin</p>
    <form id="adminLoginForm" class="space-y-3 text-xs font-mono-tech">
      <input id="admEmailInput" type="email" required value="admin@vntex.io" class="admin-well w-full px-3.5 py-2.5" />
      <input id="admPassInput" type="password" required value="admin" class="admin-well w-full px-3.5 py-2.5" />
      <button type="submit" class="w-full py-2.5 rounded-xl bg-amber-400 text-black font-extrabold uppercase cursor-pointer">Sign In to Admin Portal</button>
    </form>
  </div>

  <div id="adminDashboardWorkspace" class="hidden max-w-6xl mx-auto space-y-6">
    <header class="admin-card p-4 flex items-center justify-between">
      <div class="font-mono-tech text-sm font-extrabold text-amber-400 uppercase">VNTEX Admin Portal — Conversion Monitor &amp; Request Submission</div>
      <a href="index.html" class="admin-well px-3.5 py-1.5 font-mono-tech text-xs text-gray-300 no-underline">Toolbox Menu</a>
    </header>
    <div id="admBanner" class="hidden p-3 rounded-xl bg-amber-400/15 border border-amber-400/40 font-mono-tech text-xs text-amber-300"></div>
    <section class="admin-card p-5 space-y-3 font-mono-tech text-xs">
      <div class="text-xs font-bold uppercase text-amber-400">User Directory (Changes Sent to Owner Request Inbox)</div>
      <div class="admin-well p-3.5 flex justify-between border-rose-500/30"><span class="text-rose-300 font-bold">not logged in (Default Unauthenticated State)</span><span class="text-rose-400">NOT LOGGED IN</span></div>
      <div id="admUsersList" class="space-y-2"></div>
    </section>
  </div>

  <script>
    const DB_KEY = 'vntex_core_users_database_v6';
    const PENDING_KEY = 'vntex_core_pending_approvals_v6';
    function renderAdm() {
      const db = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
      const box = document.getElementById('admUsersList');
      box.innerHTML = db.map((u) => `
        <div class="admin-well p-3.5 flex items-center justify-between">
          <div><div class="font-bold text-white">${u.username} (${u.fullName})</div><div class="text-[11px] text-cyan-400">${u.email} • Tier: ${u.permissions?.tier?.toUpperCase()}</div></div>
          <button type="button" data-req="${u.email}" data-next="${u.permissions?.tier === 'pro' ? 'free' : 'pro'}" class="px-3 py-1.5 rounded bg-amber-400/15 border border-amber-400/40 text-amber-300 cursor-pointer">Request Tier → ${u.permissions?.tier === 'pro' ? 'FREE' : 'PRO'}</button>
        </div>
      `).join('');
      box.querySelectorAll('[data-req]').forEach((b) => {
        b.onclick = () => {
          const email = b.getAttribute('data-req'), next = b.getAttribute('data-next');
          const list = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
          list.unshift({ id: 'req_' + Date.now(), adminActor: '@vntex_admin', actionType: 'TIER_CHANGE', targetUserEmail: email, summaryText: 'Change ' + email + ' tier to ' + next.toUpperCase(), payload: { tier: next }, status: 'pending', createdAt: new Date().toISOString().slice(0, 16).replace('T', ' ') });
          localStorage.setItem(PENDING_KEY, JSON.stringify(list));
          const ban = document.getElementById('admBanner'); ban.textContent = '✓ Sent to Owner Request Inbox: Set ' + email + ' tier to ' + next.toUpperCase(); ban.classList.remove('hidden');
        };
      });
    }
    document.getElementById('adminLoginForm').onsubmit = (e) => {
      e.preventDefault();
      document.getElementById('adminLoginGate').classList.add('hidden');
      document.getElementById('adminDashboardWorkspace').classList.remove('hidden');
      renderAdm();
    };
  </script>
</body>
</html>
