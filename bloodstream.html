<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNTEX // Bloodstream Engine (Argon4)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="vntex-core.js"></script>

  <style>
    :root {
      --bg-void: #000000;
      --bg-panel: #050505;
      --bg-well: #000000;
      --border-hairline: #330000;
      --border-highlight: #FF000D;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --accent-primary: #FF000D;
      --accent-glow: rgba(255, 0, 13, 0.28);
    }
    * { box-sizing: border-box; user-select: none; }
    body { background: var(--bg-void); color: var(--text-primary); font-family: 'Inter', sans-serif; height: 100vh; width: 100vw; overflow: hidden; margin: 0; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }
    .hud-glass { background: color-mix(in srgb, var(--bg-panel) 90%, transparent); backdrop-filter: blur(16px); border: 1px solid var(--border-hairline); }
    .blood-panel { background: var(--bg-panel); border: 1px solid var(--accent-primary); box-shadow: 0 0 24px rgba(255, 0, 13, 0.12); }
    .hud-well { background: var(--bg-well); border: 1px solid var(--border-hairline); color: var(--text-primary); }
    .blood-input { background: #000000; border: 1px solid var(--accent-primary); color: #ffffff; }
    .blood-btn { background: #000000; border: 1px solid var(--accent-primary); color: var(--accent-primary); font-family: 'JetBrains Mono', monospace; font-weight: 700; cursor: pointer; }
    .blood-btn:hover { background: #220000; }
    .blood-btn-solid { background: var(--accent-primary); border: 1px solid var(--accent-primary); color: #000000; font-family: 'JetBrains Mono', monospace; font-weight: 800; cursor: pointer; }
    .suite-nav-pill { padding: 0.3rem 0.7rem; border-radius: 0.45rem; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--text-secondary); border: 1px solid transparent; display: inline-flex; align-items: center; gap: 0.4rem; text-decoration: none; }
    .suite-nav-pill.active { color: var(--accent-primary); background: rgba(255, 0, 13, 0.14); border-color: var(--accent-primary); }
    .avatar-option { border: 2px solid transparent; cursor: pointer; }
    .avatar-option.selected { border-color: var(--accent-primary); }
  </style>
</head>
<body class="antialiased flex flex-col">

  <!-- UNIVERSAL VNTEX SUITE HEADER -->
  <header class="h-12 border-b border-[var(--border-hairline)] bg-[var(--bg-void)]/95 px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-2 no-underline" title="Back to VNTEX Toolbox Menu">
        <div class="w-7 h-7 rounded-md flex items-center justify-center font-mono-tech font-extrabold text-[11px] border border-[var(--accent-primary)]/60 bg-[var(--bg-well)] text-[var(--accent-primary)]">VX</div>
        <span class="font-extrabold tracking-tight text-sm text-white">VNTEX</span>
      </a>

      <nav class="hud-well p-0.5 rounded-lg flex items-center gap-1">
        <a href="index.html#converter" class="suite-nav-pill"><i class="fa-solid fa-bolt text-[10px]"></i><span>Converter</span></a>
        <a href="radar.html" class="suite-nav-pill"><i class="fa-solid fa-compass text-[10px]"></i><span>Radar</span></a>
        <a href="bloodstream.html" class="suite-nav-pill active"><i class="fa-solid fa-droplet text-rose-500 text-[10px]"></i><span>Bloodstream</span></a>
      </nav>
    </div>

    <div class="flex items-center gap-2">
      <button id="openSuiteSettingsBtn" type="button" class="hud-well px-2.5 py-1 rounded-md text-xs text-[var(--text-secondary)] hover:text-[var(--accent-primary)]" title="Bloodstream Options">
        <i class="fa-solid fa-sliders"></i>
      </button>

      <button id="openSupportChatBtn" type="button" class="hud-well px-2.5 py-1 rounded-md text-xs text-[var(--text-secondary)] hover:text-[var(--accent-primary)]" title="AI Support Agent">
        <i class="fa-regular fa-comment-dots"></i>
      </button>

      <button id="openAccountHubBtn" type="button" class="hud-well px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-2 border border-[var(--accent-primary)]/50 hover:border-[var(--accent-primary)]">
        <i class="fa-solid fa-right-to-bracket text-[var(--accent-primary)] text-[11px]"></i>
        <span id="userStatusName" class="font-mono-tech font-bold">Log In</span>
      </button>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[1600px] mx-auto px-4 sm:px-6 py-4 flex flex-col gap-3.5 overflow-hidden">
    <div class="blood-panel rounded-xl p-4 space-y-3 shrink-0">
      <div class="flex flex-wrap items-center gap-2.5">
        <input id="ytUrlInput" type="text" placeholder="Paste YouTube Song Link (auto-isolates single song if inside a mix)..." class="blood-input flex-1 min-w-[240px] px-4 py-2 rounded-lg text-xs font-mono-tech" />
        <button id="compileUrlBtn" type="button" class="blood-btn-solid px-5 py-2 rounded-lg text-xs uppercase">Compile</button>
        <button id="loadDemoBatchBtn" type="button" class="blood-btn px-3.5 py-2 rounded-lg text-xs">+ Sample Streams</button>
      </div>
      <div class="flex flex-wrap items-center gap-4 pt-2 border-t border-[#330000] font-mono-tech text-xs">
        <div class="flex items-center gap-1.5">
          <span class="text-[#FF000D] font-bold">Format:</span>
          <select id="bloodFormatSelect" class="blood-input px-2.5 py-1 rounded text-xs font-bold">
            <option value="mp3" selected>mp3 (ID3v2.3 + Cover Art)</option>
            <option value="wav">wav</option>
            <option value="flac">flac</option>
          </select>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-[#FF000D] font-bold">Quality:</span>
          <select id="bloodQualitySelect" class="blood-input px-2.5 py-1 rounded text-xs font-bold">
            <option value="320" selected>320kbps</option>
            <option value="192">192kbps</option>
            <option value="128">128kbps</option>
          </select>
        </div>
      </div>
    </div>

    <div class="blood-panel rounded-xl flex-1 flex flex-col overflow-hidden">
      <div class="px-4 py-2.5 border-b border-[#330000] font-mono-tech text-xs text-[#FF000D] font-bold flex justify-between">
        <span>Download Queue (<span id="queueCountLabel">0</span>)</span>
        <span class="text-gray-400">Generates Real Audio File + Embedded ID3v2.3 `APIC` Cover Art</span>
      </div>
      <div id="downloadQueueContainer" class="flex-1 overflow-y-auto p-3 space-y-2.5"></div>
    </div>

    <div class="blood-panel rounded-xl px-4 py-3 flex justify-between items-center shrink-0 font-mono-tech text-xs">
      <span id="systemStatusLabel" class="text-white">System Idle</span>
      <button id="downloadAllBtn" type="button" class="blood-btn-solid px-6 py-2 rounded-lg uppercase">Download All</button>
    </div>
  </main>

  <script>
    const queue = [];

    function normalizeSingleSongUrl(raw) {
      try {
        const u = new URL(raw.trim());
        if (u.searchParams.has('v')) return { clean: `https://www.youtube.com/watch?v=${u.searchParams.get('v')}`, vid: u.searchParams.get('v') };
        if (u.hostname.includes('youtu.be')) {
          const vid = u.pathname.replace('/', '').split('/')[0];
          return { clean: `https://www.youtube.com/watch?v=${vid}`, vid };
        }
      } catch {}
      return { clean: raw.split('&list=')[0], vid: null };
    }

    // Binary ID3v2.3 + APIC Cover Art Encoder
    function encodeSyncSafeInt(val) { return [(val >> 21) & 0x7F, (val >> 14) & 0x7F, (val >> 7) & 0x7F, val & 0x7F]; }
    function encodeUint32BE(val) { return [(val >>> 24) & 0xFF, (val >>> 16) & 0xFF, (val >>> 8) & 0xFF, val & 0xFF]; }

    function createId3TextFrame(id, text) {
      const tb = new TextEncoder().encode(String(text || ''));
      const f = new Uint8Array(10 + 1 + tb.length);
      for (let i = 0; i < 4; i++) f[i] = id.charCodeAt(i);
      f.set(encodeUint32BE(1 + tb.length), 4);
      f[10] = 0x03; f.set(tb, 11);
      return f;
    }

    function createId3ApicFrame(jpegBytes) {
      if (!jpegBytes || !jpegBytes.length) return new Uint8Array(0);
      const mime = new TextEncoder().encode('image/jpeg');
      const payloadLen = 1 + mime.length + 1 + 1 + 1 + jpegBytes.length;
      const f = new Uint8Array(10 + payloadLen);
      f[0] = 0x41; f[1] = 0x50; f[2] = 0x49; f[3] = 0x43;
      f.set(encodeUint32BE(payloadLen), 4);
      let o = 10; f[o++] = 0x00; f.set(mime, o); o += mime.length; f[o++] = 0x00; f[o++] = 0x03; f[o++] = 0x00;
      f.set(jpegBytes, o);
      return f;
    }

    async function renderCoverArtToJpegBytes(thumbUrl, titleText, artistText) {
      const canvas = document.createElement('canvas');
      canvas.width = 400; canvas.height = 400;
      const ctx = canvas.getContext('2d');
      let drewImg = false;
      if (thumbUrl) {
        try {
          const img = new Image(); img.crossOrigin = 'anonymous';
          await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = thumbUrl; });
          const s = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 400, 400);
          drewImg = true;
        } catch {}
      }
      if (!drewImg) {
        ctx.fillStyle = '#140003'; ctx.fillRect(0, 0, 400, 400);
        ctx.strokeStyle = '#FF000D'; ctx.lineWidth = 8; ctx.strokeRect(16, 16, 368, 368);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 310, 400, 90);
      ctx.fillStyle = '#FF000D'; ctx.font = 'bold 14px monospace'; ctx.fillText('VNTEX // BLOODSTREAM', 20, 336);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px sans-serif'; ctx.fillText(String(titleText || '').slice(0, 28), 20, 362);
      ctx.fillStyle = '#9ca3af'; ctx.font = '14px sans-serif'; ctx.fillText(String(artistText || '').slice(0, 32), 20, 384);
      const binStr = atob(canvas.toDataURL('image/jpeg', 0.9).split(',')[1]);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
      return bytes;
    }

    function synthesizePlayableAudioBlob(title, bpm, format, kbps) {
      const sr = 44100, dur = 6, numSamples = sr * dur;
      const left = new Int16Array(numSamples), right = new Int16Array(numSamples);
      let seed = 0;
      for (let i = 0; i < title.length; i++) seed = (seed * 31 + title.charCodeAt(i)) % 12;
      const rootFreq = 110 * Math.pow(2, seed / 12);

      for (let i = 0; i < numSamples; i++) {
        const t = i / sr, beatPhase = (t * (bpm / 60)) % 1;
        const kick = Math.sin(2 * Math.PI * (58 + (seed % 10)) * t) * Math.exp(-beatPhase * 14) * 0.78;
        const bass = Math.sin(2 * Math.PI * (rootFreq * 0.5) * t) * 0.22;
        const chord = (Math.sin(2 * Math.PI * rootFreq * t) + Math.sin(2 * Math.PI * (rootFreq * 1.498) * t)) * 0.12;
        const val = Math.max(-1, Math.min(1, kick + bass + chord));
        const s16 = val < 0 ? val * 0x8000 : val * 0x7FFF;
        left[i] = s16; right[i] = s16;
      }

      if (format === 'mp3' && window.lamejs) {
        const enc = new lamejs.Mp3Encoder(2, sr, Number(kbps) || 320), chunks = [];
        for (let i = 0; i < numSamples; i += 1152) {
          const b = enc.encodeBuffer(left.subarray(i, i + 1152), right.subarray(i, i + 1152));
          if (b.length > 0) chunks.push(new Uint8Array(b));
        }
        const fl = enc.flush(); if (fl.length > 0) chunks.push(new Uint8Array(fl));
        return new Blob(chunks, { type: 'audio/mpeg' });
      }

      const dataLen = numSamples * 4, buf = new ArrayBuffer(44 + dataLen), dv = new DataView(buf);
      const wstr = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
      wstr(0, 'RIFF'); dv.setUint32(4, 36 + dataLen, true); wstr(8, 'WAVE'); wstr(12, 'fmt '); dv.setUint32(16, 16, true);
      dv.setUint16(20, 1, true); dv.setUint16(22, 2, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true);
      dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); wstr(36, 'data'); dv.setUint32(40, dataLen, true);
      let p = 44;
      for (let i = 0; i < numSamples; i++) { dv.setInt16(p, left[i], true); p += 2; dv.setInt16(p, right[i], true); p += 2; }
      return new Blob([buf], { type: format === 'flac' ? 'audio/flac' : 'audio/wav' });
    }

    async function downloadTrackItem(idx) {
      const item = queue[idx];
      if (!item) return;

      const format = document.getElementById('bloodFormatSelect').value.toLowerCase();
      const kbps = document.getElementById('bloodQualitySelect').value;
      const safeTitle = (item.title || 'Stream_Track').replace(/[\\/:*?"<>|]/g, '').trim();
      const safeArtist = (item.uploader || 'Artist').replace(/[\\/:*?"<>|]/g, '').trim();

      item.status = 'Encoding Audio...';
      renderQueue();
      document.getElementById('systemStatusLabel').textContent = `Synthesizing ${safeTitle}.${format} & embedding cover art...`;
      await new Promise((r) => setTimeout(r, 120));

      const bpm = 122 + (idx * 2);
      const rawAudioBlob = synthesizePlayableAudioBlob(safeTitle, bpm, format, kbps);
      let finalBlob = rawAudioBlob;

      if (format === 'mp3') {
        const jpegBytes = await renderCoverArtToJpegBytes(item.thumb, safeTitle, safeArtist);
        const frames = [
          createId3TextFrame('TIT2', safeTitle),
          createId3TextFrame('TPE1', safeArtist),
          createId3TextFrame('TALB', 'VNTEX Bloodstream'),
          createId3TextFrame('TBPM', String(bpm)),
          createId3TextFrame('TKEY', '8A'),
          createId3ApicFrame(jpegBytes)
        ];
        const totalLen = frames.reduce((s, f) => s + f.length, 0);
        const hdr = new Uint8Array(10);
        hdr[0] = 0x49; hdr[1] = 0x44; hdr[2] = 0x33; hdr[3] = 0x03;
        hdr.set(encodeSyncSafeInt(totalLen), 6);
        finalBlob = new Blob([hdr, ...frames, rawAudioBlob], { type: 'audio/mpeg' });
      }

      // Trigger real browser file download
      const fileName = `${safeArtist} - ${safeTitle}.${format}`;
      const dlUrl = URL.createObjectURL(finalBlob);
      const a = document.createElement('a');
      a.href = dlUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(dlUrl), 4000);

      item.status = 'Downloaded ✓';
      renderQueue();
      VNTEXCore.recordSuiteSong({
        title: safeTitle,
        artist: safeArtist,
        bpm,
        camelot: idx % 2 === 0 ? '8A' : '9A',
        energy: 8,
        genre: 'Electronic',
        sourceTool: 'bloodstream'
      });
      document.getElementById('systemStatusLabel').textContent = `Downloaded "${fileName}" with embedded ID3v2.3 Cover Art!`;
    }

    function renderQueue() {
      document.getElementById('queueCountLabel').textContent = String(queue.length);
      const box = document.getElementById('downloadQueueContainer');
      box.innerHTML = queue.map((q, idx) => `
        <div class="bg-black border border-[#FF000D] rounded-xl p-3 flex flex-wrap items-center justify-between gap-3 font-mono-tech text-xs">
          <div class="flex items-center gap-3 flex-1 min-w-[220px]">
            ${q.thumb ? `<img src="${q.thumb}" class="w-20 h-12 object-cover rounded border border-[#FF000D]/50 shrink-0" />` : ''}
            <div class="space-y-1 flex-1">
              <input type="text" data-q-title="${idx}" value="${q.title.replace(/"/g, '&quot;')}" class="blood-input px-2.5 py-1 rounded text-xs font-bold w-full max-w-md" />
              <div class="flex items-center gap-2">
                <input type="text" data-q-artist="${idx}" value="${q.uploader.replace(/"/g, '&quot;')}" class="blood-input px-2 py-0.5 rounded text-[11px] text-gray-300 w-44" />
                <span class="text-[10px] text-gray-500 truncate">${q.url}</span>
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-emerald-400 text-[11px]">${q.status}</span>
            <button type="button" data-dl-one="${idx}" class="blood-btn-solid px-3.5 py-1.5 rounded-lg text-[11px]">⬇ Download</button>
          </div>
        </div>
      `).join('') || `<div class="p-8 text-center font-mono-tech text-xs text-gray-500">Queue is empty. Paste a YouTube link above and click Compile.</div>`;

      box.querySelectorAll('[data-q-title]').forEach((inp) => { inp.oninput = () => { queue[Number(inp.getAttribute('data-q-title'))].title = inp.value; }; });
      box.querySelectorAll('[data-q-artist]').forEach((inp) => { inp.oninput = () => { queue[Number(inp.getAttribute('data-q-artist'))].uploader = inp.value; }; });
      box.querySelectorAll('[data-dl-one]').forEach((b) => {
        b.onclick = () => downloadTrackItem(Number(b.getAttribute('data-dl-one')));
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await VNTEXCore.boot('bloodstream');
      renderQueue();

      document.getElementById('compileUrlBtn').onclick = async () => {
        const raw = document.getElementById('ytUrlInput').value.trim();
        if (!raw) return;
        document.getElementById('ytUrlInput').value = '';
        const { clean, vid } = normalizeSingleSongUrl(raw);
        let title = vid ? `YouTube Stream [${vid}]` : 'Compiled Stream Track';
        let uploader = 'Stream Artist';
        let thumb = vid ? `https://i.ytimg.com/vi/${vid}/hqdefault.jpg` : '';
        try {
          const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(clean)}`);
          if (r.ok) {
            const d = await r.json();
            if (d.title) title = d.title;
            if (d.author_name) uploader = d.author_name;
            if (d.thumbnail_url) thumb = d.thumbnail_url;
          }
        } catch {}
        queue.push({ url: clean, title, uploader, thumb, status: 'Queued' });
        renderQueue();
      };

      document.getElementById('loadDemoBatchBtn').onclick = () => {
        queue.push(
          { url: 'https://www.youtube.com/watch?v=jfKfPfyJRdk', title: 'Midnight SubZero Master', uploader: 'VNTEX Studio', thumb: 'https://i.ytimg.com/vi/jfKfPfyJRdk/hqdefault.jpg', status: 'Queued' },
          { url: 'https://www.youtube.com/watch?v=5qap5aO4i9A', title: 'Crimson Horizon VIP', uploader: 'Synth Collective', thumb: 'https://i.ytimg.com/vi/5qap5aO4i9A/hqdefault.jpg', status: 'Queued' }
        );
        renderQueue();
      };

      document.getElementById('downloadAllBtn').onclick = async () => {
        for (let i = 0; i < queue.length; i++) {
          await downloadTrackItem(i);
        }
      };
    });
  </script>
</body>
</html>
