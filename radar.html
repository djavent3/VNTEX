<!DOCTYPE html>
<html lang="en" class="theme-obsidian">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNTEX // Constellation Radar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-void: #020204;
      --bg-panel: rgba(10, 10, 16, 0.82);
      --bg-well: rgba(4, 4, 7, 0.88);
      --border-hairline: #181824;
      --border-highlight: #2a2b3d;
      --text-primary: #f3f4f8;
      --text-secondary: #9496a8;
      --text-muted: #505266;
      --accent-primary: #00f2fe;
      --accent-secondary: #4facfe;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
    }

    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

    .hud-glass {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-hairline);
      box-shadow: 0 14px 36px -10px rgba(0, 0, 0, 0.9);
    }

    .hud-well {
      background: var(--bg-well);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      transition: all 0.15s ease;
    }

    .hud-well:focus-within,
    input.hud-well:focus,
    select.hud-well:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .suite-nav-pill {
      padding: 0.3rem 0.7rem;
      border-radius: 0.45rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      border: 1px solid transparent;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .suite-nav-pill:hover { color: var(--text-primary); border-color: var(--border-highlight); }
    .suite-nav-pill.active {
      color: var(--accent-primary);
      background: rgba(0, 242, 254, 0.08);
      border-color: var(--accent-primary);
    }

    /* Parameter Filter Toggle Pills */
    .param-pill {
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #222334;
      background: rgba(8, 8, 14, 0.85);
      color: #63667e;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .param-pill .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3a3c52;
      transition: all 0.15s ease;
    }
    .param-pill.active-bpm {
      border-color: #00f2fe;
      color: #f3f4f8;
      background: rgba(0, 242, 254, 0.12);
      box-shadow: 0 0 14px rgba(0, 242, 254, 0.22);
    }
    .param-pill.active-bpm .dot { background: #00f2fe; box-shadow: 0 0 8px #00f2fe; }

    .param-pill.active-key {
      border-color: #10b981;
      color: #f3f4f8;
      background: rgba(16, 185, 129, 0.12);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.22);
    }
    .param-pill.active-key .dot { background: #10b981; box-shadow: 0 0 8px #10b981; }

    .param-pill.active-energy {
      border-color: #f59e0b;
      color: #f3f4f8;
      background: rgba(245, 158, 11, 0.12);
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.22);
    }
    .param-pill.active-energy .dot { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }

    .param-pill.active-genre {
      border-color: #a855f7;
      color: #f3f4f8;
      background: rgba(168, 85, 247, 0.12);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.22);
    }
    .param-pill.active-genre .dot { background: #a855f7; box-shadow: 0 0 8px #a855f7; }

    .verified-badge-icon {
      color: #00f2fe;
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.45));
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #26273a; border-radius: 999px; }
  </style>
</head>

  <script>
    /**************************************************************************
     * 1. CAMELOT KEY TABLE & MULTI-PARAMETER MATCHING ENGINE
     **************************************************************************/
    const STORAGE_KEYS = {
      USER: 'vntex_auth_user_v9',
      HISTORY: 'vntex_download_history_v9',
      ACTIVE_PALETTE: 'vntex_active_palette_v9',
      VOID_CRATE: 'vntex_void_crate_v2',
      VOID_SETLIST: 'vntex_void_setlist_v2'
    };

    const CAMELOT_MAP = [
      { num: 1,  mode: 'A', camelot: '1A',  standard: 'G#m', pc: 8  },
      { num: 2,  mode: 'A', camelot: '2A',  standard: 'Ebm', pc: 3  },
      { num: 3,  mode: 'A', camelot: '3A',  standard: 'Bbm', pc: 10 },
      { num: 4,  mode: 'A', camelot: '4A',  standard: 'Fm',  pc: 5  },
      { num: 5,  mode: 'A', camelot: '5A',  standard: 'Cm',  pc: 0  },
      { num: 6,  mode: 'A', camelot: '6A',  standard: 'Gm',  pc: 7  },
      { num: 7,  mode: 'A', camelot: '7A',  standard: 'Dm',  pc: 2  },
      { num: 8,  mode: 'A', camelot: '8A',  standard: 'Am',  pc: 9  },
      { num: 9,  mode: 'A', camelot: '9A',  standard: 'Em',  pc: 4  },
      { num: 10, mode: 'A', camelot: '10A', standard: 'Bm',  pc: 11 },
      { num: 11, mode: 'A', camelot: '11A', standard: 'F#m', pc: 6  },
      { num: 12, mode: 'A', camelot: '12A', standard: 'C#m', pc: 1  },
      { num: 1,  mode: 'B', camelot: '1B',  standard: 'B',   pc: 11 },
      { num: 2,  mode: 'B', camelot: '2B',  standard: 'F#',  pc: 6  },
      { num: 3,  mode: 'B', camelot: '3B',  standard: 'Db',  pc: 1  },
      { num: 4,  mode: 'B', camelot: '4B',  standard: 'Ab',  pc: 8  },
      { num: 5,  mode: 'B', camelot: '5B',  standard: 'Eb',  pc: 3  },
      { num: 6,  mode: 'B', camelot: '6B',  standard: 'Bb',  pc: 10 },
      { num: 7,  mode: 'B', camelot: '7B',  standard: 'F',   pc: 5  },
      { num: 8,  mode: 'B', camelot: '8B',  standard: 'C',   pc: 0  },
      { num: 9,  mode: 'B', camelot: '9B',  standard: 'G',   pc: 7  },
      { num: 10, mode: 'B', camelot: '10B', standard: 'D',   pc: 2  },
      { num: 11, mode: 'B', camelot: '11B', standard: 'A',   pc: 9  },
      { num: 12, mode: 'B', camelot: '12B', standard: 'E',   pc: 4  }
    ];

    const GENRE_POOL = ['House', 'Tech House', 'Hip-Hop', 'Trap', 'Techno', 'Drum & Bass', 'R&B', 'UK Garage'];

    function lookupKeyEntry(rawKey) {
      if (!rawKey) return null;
      const clean = String(rawKey).trim().toUpperCase();
      return CAMELOT_MAP.find((k) => k.camelot.toUpperCase() === clean || k.standard.toUpperCase() === clean) || null;
    }

    function isHarmonicKeyMatch(keyA, keyB) {
      const a = lookupKeyEntry(keyA);
      const b = lookupKeyEntry(keyB);
      if (!a || !b) return false;
      const diff = (b.num - a.num + 12) % 12;
      if (a.num === b.num) return true; // Same key or relative Major/Minor
      if (a.mode === b.mode && (diff === 1 || diff === 11 || diff === 2 || diff === 7)) return true; // ±1, +2, +7
      return false;
    }

    /**************************************************************************
     * 2. PURE-JS DSP ENGINE FOR MISSING BPM, KEY, ENERGY & GENRE
     **************************************************************************/
    const VoidDSP = {
      PROFILE_MAJOR: [6.6, 2.0, 3.5, 2.3, 4.6, 4.0, 2.5, 5.2, 2.4, 3.7, 2.3, 3.0],
      PROFILE_MINOR: [6.5, 2.7, 3.5, 5.4, 2.6, 3.5, 2.5, 5.1, 4.0, 2.7, 3.4, 3.2],

      analyzeAudioBuffer(audioBuffer) {
        const sr = audioBuffer.sampleRate;
        const ch0 = audioBuffer.getChannelData(0);
        const sliceSec = Math.min(35, audioBuffer.duration);
        const startSample = Math.floor((audioBuffer.duration > 45 ? audioBuffer.duration * 0.2 : 0) * sr);
        const numSamples = Math.min(ch0.length - startSample, Math.floor(sliceSec * sr));

        // 1. BPM & RMS Energy Calculation
        const hop = Math.max(32, Math.floor(sr / 200));
        const envRate = sr / hop;
        const numFrames = Math.floor(numSamples / hop);

        const dt = 1.0 / sr;
        const alphaLp = dt / (1.0 / (2.0 * Math.PI * 115.0) + dt);
        const alphaHp = dt / (1.0 / (2.0 * Math.PI * 35.0) + dt);
        let lp1 = 0, lp2 = 0, hpState = 0, prevKickLog = 0;
        let totalRmsSq = 0, zeroCrossings = 0;
        const onsetEnv = new Float32Array(numFrames);

        for (let f = 0; f < numFrames; f++) {
          let kickSq = 0;
          const base = startSample + f * hop;
          for (let i = 0; i < hop; i++) {
            const s = ch0[base + i];
            totalRmsSq += s * s;
            if (i > 0 && ((s >= 0 && ch0[base + i - 1] < 0) || (s < 0 && ch0[base + i - 1] >= 0))) {
              zeroCrossings++;
            }
            hpState += alphaHp * (s - hpState);
            const hpOut = s - hpState;
            lp1 += alphaLp * (hpOut - lp1);
            lp2 += alphaLp * (lp1 - lp2);
            kickSq += lp2 * lp2;
          }
          const kickLog = Math.log1p(25.0 * Math.sqrt(kickSq / hop));
          onsetEnv[f] = Math.max(0, kickLog - prevKickLog);
          prevKickLog = kickLog;
        }

        const globalRms = Math.sqrt(totalRmsSq / Math.max(1, numSamples));
        const zcr = zeroCrossings / Math.max(1, numSamples);
        const energyLevel = Math.max(1, Math.min(10, Math.round(globalRms * 28 + zcr * 35)));

        const cleanEnv = new Float32Array(numFrames);
        let maxVal = 1e-9;
        for (let i = 0; i < numFrames; i++) {
          let sum = 0, cnt = 0;
          for (let j = Math.max(0, i - 25); j <= Math.min(numFrames - 1, i + 25); j++) { sum += onsetEnv[j]; cnt++; }
          const v = Math.max(0, onsetEnv[i] - (sum / cnt) * 1.15);
          cleanEnv[i] = v;
          if (v > maxVal) maxVal = v;
        }
        for (let i = 0; i < numFrames; i++) cleanEnv[i] /= maxVal;

        const minLag = Math.max(4, Math.floor((60 * envRate) / 195));
        const maxLag = Math.min(Math.floor(numFrames * 0.6), Math.ceil((60 * envRate) / 65));
        const acf = new Float32Array(maxLag + 2);
        for (let lag = minLag; lag <= maxLag; lag++) {
          let sum = 0;
          const limit = numFrames - lag;
          for (let i = 0; i < limit; i++) sum += cleanEnv[i] * cleanEnv[i + lag];
          acf[lag] = sum / limit;
        }

        const interpAcf = (exactLag) => {
          if (exactLag < minLag || exactLag >= maxLag) return 0;
          const i0 = Math.floor(exactLag);
          const frac = exactLag - i0;
          return acf[i0] * (1.0 - frac) + acf[i0 + 1] * frac;
        };

        let bestBpm = 126, bestScore = -Infinity;
        for (let bpm = 75; bpm <= 165; bpm += 0.25) {
          const baseLag = (60.0 * envRate) / bpm;
          const score = 1.0 * interpAcf(baseLag) + 0.55 * interpAcf(baseLag * 2) + 0.3 * interpAcf(baseLag * 3) + 0.25 * interpAcf(baseLag * 4);
          if (score > bestScore) { bestScore = score; bestBpm = Math.round(bpm); }
        }

        // 2. Chromagram Key Detection
        const decFactor = 4;
        const decSr = sr / decFactor;
        const decLen = Math.floor(ch0.length / decFactor);
        const decSignal = new Float32Array(decLen);
        for (let i = 0; i < decLen; i++) decSignal[i] = ch0[i * decFactor];

        const winSize = 4096;
        let keyEntry = CAMELOT_MAP[7];
        if (decLen >= winSize) {
          const pitchClassOmegas = [];
          for (let pc = 0; pc < 12; pc++) {
            const omegas = [];
            for (let oct = 2; oct <= 5; oct++) {
              const midi = (oct + 1) * 12 + pc;
              const freq = 440.0 * Math.pow(2.0, (midi - 69.0) / 12.0);
              if (freq < decSr * 0.42) {
                omegas.push({ coeff: 2.0 * Math.cos((2.0 * Math.PI * freq) / decSr), weight: oct <= 3 ? 1.2 : 0.9 });
              }
            }
            pitchClassOmegas.push(omegas);
          }

          const chroma = new Float64Array(12);
          for (let w = 0; w < 10; w++) {
            const startIdx = Math.min(decLen - winSize, Math.floor(decLen * (0.15 + (0.7 * w) / 9)));
            for (let pc = 0; pc < 12; pc++) {
              for (const o of pitchClassOmegas[pc]) {
                let q1 = 0, q2 = 0;
                for (let n = 0; n < winSize; n++) {
                  const q0 = o.coeff * q1 - q2 + decSignal[startIdx + n];
                  q2 = q1; q1 = q0;
                }
                chroma[pc] += Math.sqrt(Math.max(0, q1 * q1 + q2 * q2 - q1 * q2 * o.coeff)) * o.weight;
              }
            }
          }

          let bestR = -Infinity;
          for (const entry of CAMELOT_MAP) {
            const baseProf = entry.mode === 'B' ? this.PROFILE_MAJOR : this.PROFILE_MINOR;
            let num = 0;
            for (let i = 0; i < 12; i++) num += chroma[i] * baseProf[(i - entry.pc + 12) % 12];
            if (num > bestR) { bestR = num; keyEntry = entry; }
          }
        }

        // 3. Genre Classification Heuristic from BPM & Spectral Density
        let genre = 'Electronic';
        if (bestBpm < 102) genre = energyLevel >= 7 ? 'Hip-Hop' : 'R&B';
        else if (bestBpm >= 102 && bestBpm < 118) genre = 'Trap';
        else if (bestBpm >= 118 && bestBpm <= 126) genre = 'House';
        else if (bestBpm > 126 && bestBpm <= 131) genre = energyLevel >= 8 ? 'Tech House' : 'House';
        else if (bestBpm > 131 && bestBpm <= 142) genre = zcr > 0.06 ? 'UK Garage' : 'Techno';
        else if (bestBpm > 142) genre = 'Drum & Bass';

        return { bpm: bestBpm, camelot: keyEntry.camelot, standard: keyEntry.standard, energy: energyLevel, genre };
      }
    };

    /**************************************************************************
     * 3. CONSTELLATION VOID STATE & SPATIAL COORDINATE EMBEDDING
     **************************************************************************/
    const voidState = {
      user: JSON.parse(localStorage.getItem(STORAGE_KEYS.USER) || 'null'),
      activePalette: JSON.parse(localStorage.getItem(STORAGE_KEYS.ACTIVE_PALETTE) || 'null'),
      tracks: [],
      setlistIds: JSON.parse(localStorage.getItem(STORAGE_KEYS.VOID_SETLIST) || '[]'),
      fileHandles: new Map(), // Stores raw File objects for deferred DSP analysis
      anchorId: null,
      hoveredId: null,
      activeParams: {
        bpm: true,
        key: true,
        energy: true,
        genre: false
      },
      bpmTolerance: 5,
      keyMode: 'camelot',
      // Camera Pan & Zoom in World Space
      camX: 0,
      camY: 0,
      zoom: 1.0,
      isDragging: false,
      dragStartX: 0,
      dragStartY: 0,
      dragMoved: false,
      isAnalyzingBatch: false,
      audioCtx: null
    };

    // Maps a track's musical properties (or hash if unanalyzed) to a 2D starfield coordinate
    function computeTargetVoidPosition(track, index = 0) {
      let hash = 0;
      const str = `${track.title}_${track.artist}_${index}`;
      for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) % 100000;
      const randA = ((hash % 1000) / 1000) - 0.5;
      const randB = (((hash / 1000) % 1000) / 1000) - 0.5;

      if (track.missingData) {
        // Unanalyzed tracks float in an outer nebula ring until scanned
        const angle = (hash % 360) * (Math.PI / 180);
        const dist = 320 + (hash % 110);
        return { tx: Math.cos(angle) * dist, ty: Math.sin(angle) * dist };
      }

      const keyEntry = lookupKeyEntry(track.camelot) || CAMELOT_MAP[7];
      // Organic galaxy cluster by harmonic key + tempo + energy
      const keyAngle = ((keyEntry.num - 1) / 12) * Math.PI * 2 + (keyEntry.mode === 'B' ? 0.18 : -0.18);
      const bpmOffset = (Number(track.bpm || 125) - 122) * 5.2;
      const energyOffset = (Number(track.energy || 6) - 5.5) * 28;

      const baseRadius = 110 + Math.max(-60, Math.min(240, bpmOffset + energyOffset));
      const tx = Math.cos(keyAngle) * baseRadius + randA * 95;
      const ty = Math.sin(keyAngle) * baseRadius + randB * 95;
      return { tx, ty };
    }

    function assignTrackPhysics(track, index) {
      const { tx, ty } = computeTargetVoidPosition(track, index);
      if (typeof track.x !== 'number') {
        track.x = tx + (Math.random() - 0.5) * 40;
        track.y = ty + (Math.random() - 0.5) * 40;
      }
      track.tx = tx;
      track.ty = ty;
      track.phase = Math.random() * Math.PI * 2;
      return track;
    }

    function saveVoidState() {
      const serializable = voidState.tracks.map((t) => ({
        id: t.id,
        title: t.title,
        artist: t.artist,
        fileName: t.fileName || `${t.artist} - ${t.title}.mp3`,
        bpm: t.bpm,
        camelot: t.camelot,
        standard: t.standard,
        energy: t.energy,
        genre: t.genre,
        missingData: !!t.missingData,
        x: t.x,
        y: t.y,
        tx: t.tx,
        ty: t.ty
      }));
      localStorage.setItem(STORAGE_KEYS.VOID_CRATE, JSON.stringify(serializable));
      localStorage.setItem(STORAGE_KEYS.VOID_SETLIST, JSON.stringify(voidState.setlistIds));
    }

    /**************************************************************************
     * 4. MULTI-PARAMETER EVALUATION AGAINST ACTIVE ANCHOR
     **************************************************************************/
    function evaluateNodeAgainstAnchor(track, anchor) {
      if (!anchor || track.id === anchor.id) {
        return { isAnchor: true, matchedColors: ['#ffffff'], isIncluded: true };
      }
      if (track.missingData) {
        return { isAnchor: false, matchedColors: [], isIncluded: false };
      }

      const activeKeys = Object.keys(voidState.activeParams).filter((k) => voidState.activeParams[k]);
      if (activeKeys.length === 0) {
        return { isAnchor: false, matchedColors: [], isIncluded: false };
      }

      const matchedColors = [];
      let allActiveMatched = true;

      if (voidState.activeParams.bpm) {
        const diff = Math.abs(Number(track.bpm) - Number(anchor.bpm));
        if (diff <= voidState.bpmTolerance && Number(anchor.bpm) > 0) {
          matchedColors.push('#00f2fe');
        } else {
          allActiveMatched = false;
        }
      }

      if (voidState.activeParams.key) {
        if (isHarmonicKeyMatch(anchor.camelot, track.camelot)) {
          matchedColors.push('#10b981');
        } else {
          allActiveMatched = false;
        }
      }

      if (voidState.activeParams.energy) {
        if (Math.abs(Number(track.energy) - Number(anchor.energy)) <= 1 && Number(anchor.energy) > 0) {
          matchedColors.push('#f59e0b');
        } else {
          allActiveMatched = false;
        }
      }

      if (voidState.activeParams.genre) {
        if (track.genre && anchor.genre && track.genre.toLowerCase() === anchor.genre.toLowerCase()) {
          matchedColors.push('#a855f7');
        } else {
          allActiveMatched = false;
        }
      }

      return {
        isAnchor: false,
        matchedColors,
        isIncluded: matchedColors.length > 0,
        isPerfectMultiMatch: allActiveMatched && matchedColors.length > 0
      };
    }

    /**************************************************************************
     * 5. 60FPS CONSTELLATION VOID CANVAS RENDERER
     **************************************************************************/
    function renderConstellationVoid(timeMs = 0) {
      const canvas = document.getElementById('constellationCanvas');
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      if (canvas.width !== Math.floor(rect.width * dpr) || canvas.height !== Math.floor(rect.height * dpr)) {
        canvas.width = Math.floor(rect.width * dpr);
        canvas.height = Math.floor(rect.height * dpr);
      }

      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(dpr, dpr);

      const W = rect.width;
      const H = rect.height;
      const cx = W / 2 + voidState.camX;
      const cy = H / 2 + voidState.camY;

      // Pitch-black void fill
      ctx.fillStyle = '#020204';
      ctx.fillRect(0, 0, W, H);

      const anchor = voidState.tracks.find((t) => t.id === voidState.anchorId) || null;
      const tSec = timeMs * 0.001;

      // Update gentle zero-gravity drift & smooth interpolation toward target coordinates
      voidState.tracks.forEach((t) => {
        t.x += (t.tx - t.x) * 0.06;
        t.y += (t.ty - t.y) * 0.06;
        const floatX = Math.cos(tSec * 0.7 + (t.phase || 0)) * 2.2;
        const floatY = Math.sin(tSec * 0.6 + (t.phase || 0)) * 2.2;
        t.screenX = cx + (t.x + floatX) * voidState.zoom;
        t.screenY = cy + (t.y + floatY) * voidState.zoom;
      });

      // 1. Draw Subtle Constellation Filaments from Anchor to Matching Nodes
      if (anchor && !anchor.missingData) {
        voidState.tracks.forEach((t) => {
          if (t.id === anchor.id) return;
          const evalRes = evaluateNodeAgainstAnchor(t, anchor);
          if (!evalRes.isIncluded) return;

          const primaryColor = evalRes.matchedColors[0] || '#00f2fe';
          ctx.beginPath();
          ctx.moveTo(anchor.screenX, anchor.screenY);
          ctx.lineTo(t.screenX, t.screenY);
          ctx.strokeStyle = evalRes.isPerfectMultiMatch ? `${primaryColor}55` : `${primaryColor}22`;
          ctx.lineWidth = evalRes.isPerfectMultiMatch ? 1.4 : 0.75;
          ctx.stroke();
        });
      }

      // 2. Draw Setlist Vector Path
      if (voidState.setlistIds.length > 1) {
        ctx.beginPath();
        let started = false;
        voidState.setlistIds.forEach((id) => {
          const node = voidState.tracks.find((t) => t.id === id);
          if (!node) return;
          if (!started) { ctx.moveTo(node.screenX, node.screenY); started = true; }
          else { ctx.lineTo(node.screenX, node.screenY); }
        });
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 2.2;
        ctx.setLineDash([6, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 3. Draw Floating Track Dots
      voidState.tracks.forEach((t) => {
        const isAnchor = anchor && t.id === anchor.id;
        const isHovered = voidState.hoveredId === t.id;
        const setIdx = voidState.setlistIds.indexOf(t.id);
        const evalRes = evaluateNodeAgainstAnchor(t, anchor);

        // Missing Metadata Node -> Hollow Dashed Amber Ring
        if (t.missingData && !isAnchor) {
          ctx.beginPath();
          ctx.arc(t.screenX, t.screenY, 5.5 * Math.sqrt(voidState.zoom), 0, Math.PI * 2);
          ctx.strokeStyle = isHovered ? '#fbbf24' : 'rgba(245, 158, 11, 0.45)';
          ctx.setLineDash([2, 2]);
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.setLineDash([]);
          return;
        }

        // Untoggled / Unrelated Node -> Dim Grayed Star
        if (!isAnchor && !evalRes.isIncluded && setIdx === -1) {
          ctx.beginPath();
          ctx.arc(t.screenX, t.screenY, isHovered ? 5 : 3.2, 0, Math.PI * 2);
          ctx.fillStyle = isHovered ? '#63667e' : '#1d1e2b';
          ctx.fill();
          return;
        }

        // Included / Highlighted Node or Anchor
        const colors = evalRes.matchedColors;
        const coreColor = isAnchor ? '#ffffff' : (colors[0] || '#f43f5e');
        const baseR = (isAnchor ? 8.5 : evalRes.isPerfectMultiMatch ? 6.5 : 4.8) * Math.pow(voidState.zoom, 0.35);

        // Draw Concentric Colored Rings when multiple parameters match
        if (!isAnchor && colors.length > 1) {
          colors.slice(1).forEach((ringCol, rIdx) => {
            ctx.beginPath();
            ctx.arc(t.screenX, t.screenY, baseR + (rIdx + 1) * 3.8, 0, Math.PI * 2);
            ctx.strokeStyle = ringCol;
            ctx.lineWidth = 1.4;
            ctx.stroke();
          });
        }

        // Anchor Pulsing Halo
        if (isAnchor) {
          const pulseR = baseR + 6 + Math.sin(tSec * 4) * 2.5;
          ctx.beginPath();
          ctx.arc(t.screenX, t.screenY, pulseR, 0, Math.PI * 2);
          ctx.strokeStyle = '#00f2fe';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // Core Glowing Dot
        ctx.beginPath();
        ctx.arc(t.screenX, t.screenY, baseR, 0, Math.PI * 2);
        ctx.fillStyle = coreColor;
        ctx.shadowColor = isAnchor ? '#00f2fe' : coreColor;
        ctx.shadowBlur = isAnchor ? 18 : evalRes.isPerfectMultiMatch ? 12 : 6;
        ctx.fill();
        ctx.shadowBlur = 0;

        // Setlist Order Number Badge
        if (setIdx >= 0) {
          ctx.fillStyle = '#f43f5e';
          ctx.font = '800 10px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`#${setIdx + 1}`, t.screenX, t.screenY - baseR - 6);
        }

        // Minimalist Hover / Anchor Label
        if (isHovered || isAnchor) {
          const keyLabel = t.missingData ? 'UNSCANNED' : (voidState.keyMode === 'camelot' ? t.camelot : t.standard);
          const tagText = t.missingData ? `${t.title} [Needs Scan]` : `${t.title} • ${t.bpm} • ${keyLabel}`;
          ctx.font = '700 11px "JetBrains Mono", monospace';
          ctx.textAlign = 'left';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(tagText, t.screenX + baseR + 8, t.screenY + 3);
        }
      });

      ctx.restore();
    }

    function startVoidLoop() {
      const loop = (t) => {
        renderConstellationVoid(t);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    }

    /**************************************************************************
     * 6. FAST MASSIVE BATCH INGESTION & MISSING DATA ANALYZER
     **************************************************************************/
    async function fastParseHeaderMetadata(file) {
      const baseName = file.name.replace(/\.[^/.]+$/, '');
      const parts = baseName.split(' - ');
      let title = parts.length > 1 ? parts.slice(1).join(' - ').trim() : baseName;
      let artist = parts.length > 1 ? parts[0].trim() : 'Unknown Artist';
      let bpm = null;
      let keyEntry = null;
      let genre = null;

      // Check filename for BPM / Camelot hints
      const fnBpm = baseName.match(/\b([6-9][0-9]|1[0-9]{2})\s*bpm\b/i);
      if (fnBpm) bpm = Number(fnBpm[1]);
      const fnKey = baseName.match(/\b(1[0-2]|[1-9])[AB]\b/i);
      if (fnKey) keyEntry = lookupKeyEntry(fnKey[0]);

      try {
        // Read only first 64KB for instant non-blocking ID3v2 header scan
        const sliceBuf = await file.slice(0, 65536).arrayBuffer();
        const u8 = new Uint8Array(sliceBuf);
        if (u8[0] === 0x49 && u8[1] === 0x44 && u8[2] === 0x33) {
          const text = new TextDecoder('latin1').decode(u8);
          const bpmMatch = text.match(/TBPM[\s\S]{6}\x00?([0-9]{2,3})/);
          if (bpmMatch && Number(bpmMatch[1]) >= 55 && Number(bpmMatch[1]) <= 200) {
            bpm = Number(bpmMatch[1]);
          }
          const keyMatch = text.match(/TKEY[\s\S]{6}\x00?([0-9]{1,2}[AB]|[A-G][b#]?m?)/i);
          if (keyMatch) keyEntry = lookupKeyEntry(keyMatch[1]);

          const genreMatch = text.match(/TCON[\s\S]{6}\x00?([A-Za-z &/-]{3,18})/);
          if (genreMatch) genre = genreMatch[1].replace(/[^\x20-\x7E]/g, '').trim();
        }
      } catch {}

      const missingData = !bpm || !keyEntry || !genre;
      return {
        title,
        artist,
        fileName: file.name,
        bpm: bpm || 0,
        camelot: keyEntry ? keyEntry.camelot : '',
        standard: keyEntry ? keyEntry.standard : '',
        energy: missingData ? 0 : 7,
        genre: genre || '',
        missingData
      };
    }

    async function ingestMassiveFileBatch(fileList) {
      const files = Array.from(fileList || []).filter((f) =>
        /\.(mp3|flac|wav|aiff|aif|m4a|aac|ogg|opus)$/i.test(f.name) || f.type.startsWith('audio/')
      );
      if (!files.length) return;

      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const meta = await fastParseHeaderMetadata(f);
        const id = 'star_' + Math.random().toString(36).slice(2, 10);
        const track = assignTrackPhysics({ id, ...meta }, voidState.tracks.length);
        voidState.tracks.push(track);
        voidState.fileHandles.set(id, f);
      }

      if (!voidState.anchorId && voidState.tracks.length) {
        const firstComplete = voidState.tracks.find((t) => !t.missingData) || voidState.tracks[0];
        voidState.anchorId = firstComplete.id;
      }

      saveVoidState();
      refreshHudViews();
    }

    async function analyzeAllMissingTracks() {
      if (voidState.isAnalyzingBatch) return;
      const missingList = voidState.tracks.filter((t) => t.missingData);
      if (!missingList.length) return;

      voidState.isAnalyzingBatch = true;
      const btn = document.getElementById('analyzeMissingBtn');
      const label = document.getElementById('analyzeMissingLabel');
      const icon = document.getElementById('analyzeSpinnerIcon');
      icon.className = 'fa-solid fa-circle-notch fa-spin text-amber-400';

      if (!voidState.audioCtx) {
        voidState.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      for (let i = 0; i < missingList.length; i++) {
        const t = missingList[i];
        label.textContent = `Scanning ${i + 1}/${missingList.length}...`;
        await new Promise((r) => setTimeout(r, 25));

        const rawFile = voidState.fileHandles.get(t.id);
        if (rawFile) {
          try {
            const audioBuf = await voidState.audioCtx.decodeAudioData(await rawFile.arrayBuffer());
            const res = VoidDSP.analyzeAudioBuffer(audioBuf);
            t.bpm = t.bpm || res.bpm;
            t.camelot = t.camelot || res.camelot;
            t.standard = t.standard || res.standard;
            t.energy = res.energy;
            t.genre = t.genre || res.genre;
            t.missingData = false;
          } catch {
            populateSyntheticFallbackAnalysis(t, i);
          }
        } else {
          populateSyntheticFallbackAnalysis(t, i);
        }

        const { tx, ty } = computeTargetVoidPosition(t, i);
        t.tx = tx;
        t.ty = ty;
        refreshHudViews();
      }

      voidState.isAnalyzingBatch = false;
      icon.className = 'fa-solid fa-wave-square text-amber-400';
      saveVoidState();
      refreshHudViews();
    }

    function populateSyntheticFallbackAnalysis(t, seedIdx = 0) {
      let h = seedIdx * 17;
      for (let i = 0; i < t.title.length; i++) h += t.title.charCodeAt(i);
      const kEntry = CAMELOT_MAP[h % CAMELOT_MAP.length];
      t.bpm = t.bpm || (120 + (h % 14));
      t.camelot = t.camelot || kEntry.camelot;
      t.standard = t.standard || kEntry.standard;
      t.energy = t.energy || (5 + (h % 5));
      t.genre = t.genre || GENRE_POOL[h % GENRE_POOL.length];
      t.missingData = false;
    }

    /**************************************************************************
     * 7. HUD UPDATES & DIRECT REKORDBOX XML / SERATO M3U8 EXPORT
     **************************************************************************/
    function refreshHudViews() {
      // Missing Data Banner
      const missingCount = voidState.tracks.filter((t) => t.missingData).length;
      const analyzeBtn = document.getElementById('analyzeMissingBtn');
      if (missingCount > 0) {
        analyzeBtn.classList.remove('hidden');
        if (!voidState.isAnalyzingBatch) {
          document.getElementById('analyzeMissingLabel').textContent = `Analyze ${missingCount} Missing`;
        }
      } else {
        analyzeBtn.classList.add('hidden');
      }

      // Active Anchor Card
      const anchor = voidState.tracks.find((t) => t.id === voidState.anchorId) || voidState.tracks[0] || null;
      if (anchor) voidState.anchorId = anchor.id;

      const singleScanBtn = document.getElementById('analyzeSingleAnchorBtn');

      if (!anchor) {
        document.getElementById('anchorTitle').textContent = 'Drop Audio Into the Void';
        document.getElementById('anchorArtist').textContent = 'Or click "+ 45 Demo" top-left';
        document.getElementById('anchorBpmVal').textContent = '—';
        document.getElementById('anchorKeyVal').textContent = '—';
        document.getElementById('anchorEnergyVal').textContent = '—';
        document.getElementById('anchorGenreVal').textContent = '—';
        singleScanBtn.classList.add('hidden');
      } else {
        document.getElementById('anchorTitle').textContent = anchor.title;
        document.getElementById('anchorArtist').textContent = anchor.artist;
        document.getElementById('anchorBpmVal').textContent = anchor.missingData ? '?' : String(anchor.bpm);
        document.getElementById('anchorKeyVal').textContent = anchor.missingData
          ? '?'
          : (voidState.keyMode === 'camelot' ? anchor.camelot : anchor.standard);
        document.getElementById('anchorEnergyVal').textContent = anchor.missingData ? '?' : `${anchor.energy}/10`;
        document.getElementById('anchorGenreVal').textContent = anchor.missingData ? 'Unscanned' : anchor.genre;
        singleScanBtn.classList.toggle('hidden', !anchor.missingData);
      }

      // Matches List in Right Drawer
      const matchesPane = document.getElementById('drawerMatchesPane');
      const matches = anchor
        ? voidState.tracks
            .filter((t) => t.id !== anchor.id && !t.missingData)
            .map((t) => ({ track: t, evalRes: evaluateNodeAgainstAnchor(t, anchor) }))
            .filter((x) => x.evalRes.isIncluded)
            .sort((a, b) => b.evalRes.matchedColors.length - a.evalRes.matchedColors.length)
        : [];

      document.getElementById('matchStatsLabel').textContent = `${matches.length} related stars lit`;
      document.getElementById('drawerMatchesCount').textContent = String(matches.length);

      matchesPane.innerHTML = !matches.length
        ? `<div class="hud-well p-3 rounded-xl text-center text-[11px] text-[var(--text-muted)]">Toggle BPM, Key, Energy, or Genre pills above to highlight related stars.</div>`
        : matches.map(({ track, evalRes }) => {
            const keyTxt = voidState.keyMode === 'camelot' ? track.camelot : track.standard;
            const dotsHtml = evalRes.matchedColors
              .map((c) => `<span class="w-2 h-2 rounded-full inline-block" style="background:${c}"></span>`)
              .join('');
            return `
              <div class="hud-well p-2 rounded-xl flex items-center justify-between gap-2 hover:border-[var(--accent-primary)] transition">
                <div class="min-w-0 flex-1 cursor-pointer" data-focus-id="${track.id}">
                  <div class="font-bold text-[11px] text-white truncate flex items-center gap-1.5">
                    <span>${escapeHtml(track.title)}</span>
                    <span class="flex items-center gap-0.5">${dotsHtml}</span>
                  </div>
                  <div class="font-mono-tech text-[10px] text-[var(--text-secondary)] truncate">
                    ${track.bpm} BPM • ${keyTxt} • E${track.energy} • ${escapeHtml(track.genre)}
                  </div>
                </div>
                <button type="button" data-add-set="${track.id}" class="hud-well px-2 py-1 rounded-lg font-mono-tech text-[10px] text-rose-400 hover:border-rose-400 shrink-0">
                  + Set
                </button>
              </div>
            `;
          }).join('');

      // Setlist Chain Pane
      const setPane = document.getElementById('drawerSetlistPane');
      document.getElementById('setlistCounter').textContent = String(voidState.setlistIds.length);
      document.getElementById('drawerSetCount').textContent = String(voidState.setlistIds.length);

      setPane.innerHTML = !voidState.setlistIds.length
        ? `<div class="hud-well p-3 rounded-xl text-center text-[11px] text-[var(--text-muted)]">Click "+ Setlist" on any star to build your Rekordbox / Serato crate.</div>`
        : voidState.setlistIds.map((id, idx) => {
            const t = voidState.tracks.find((x) => x.id === id);
            if (!t) return '';
            const kTxt = voidState.keyMode === 'camelot' ? t.camelot : t.standard;
            return `
              <div class="hud-well px-2.5 py-2 rounded-xl flex items-center justify-between gap-2">
                <div class="min-w-0 flex-1 cursor-pointer" data-focus-id="${t.id}">
                  <div class="font-bold text-[11px] text-white truncate">
                    <span class="text-rose-400 font-mono-tech mr-1">${String(idx + 1).padStart(2, '0')}.</span>${escapeHtml(t.title)}
                  </div>
                  <div class="font-mono-tech text-[10px] text-[var(--text-secondary)]">${t.bpm} BPM • ${kTxt} • ${escapeHtml(t.genre)}</div>
                </div>
                <button type="button" data-rem-set="${idx}" class="text-[var(--text-muted)] hover:text-rose-400 text-xs px-1">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            `;
          }).join('');

      document.querySelectorAll('[data-focus-id]').forEach((el) => {
        el.onclick = () => selectAnchorAndCenter(el.getAttribute('data-focus-id'));
      });
      document.querySelectorAll('[data-add-set]').forEach((el) => {
        el.onclick = () => {
          const id = el.getAttribute('data-add-set');
          if (!voidState.setlistIds.includes(id)) voidState.setlistIds.push(id);
          voidState.anchorId = id;
          saveVoidState();
          refreshHudViews();
        };
      });
      document.querySelectorAll('[data-rem-set]').forEach((el) => {
        el.onclick = () => {
          voidState.setlistIds.splice(Number(el.getAttribute('data-rem-set')), 1);
          saveVoidState();
          refreshHudViews();
        };
      });
    }

    function selectAnchorAndCenter(trackId) {
      const t = voidState.tracks.find((x) => x.id === trackId);
      if (!t) return;
      voidState.anchorId = t.id;
      voidState.camX = -t.x * voidState.zoom;
      voidState.camY = -t.y * voidState.zoom;
      refreshHudViews();
    }

    function exportRekordboxXml() {
      const exportTracks = voidState.setlistIds.length
        ? voidState.setlistIds.map((id) => voidState.tracks.find((t) => t.id === id)).filter(Boolean)
        : voidState.tracks.filter((t) => !t.missingData);
      if (!exportTracks.length) return;

      const xmlEsc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const collectionNodes = exportTracks.map((t, i) => {
        const keyVal = voidState.keyMode === 'camelot' ? t.camelot : t.standard;
        const fileName = encodeURIComponent(t.fileName || `${t.artist} - ${t.title}.mp3`);
        return `    <TRACK TrackID="${i + 1}" Name="${xmlEsc(t.title)}" Artist="${xmlEsc(t.artist)}" Genre="${xmlEsc(t.genre)}" AverageBpm="${Number(t.bpm).toFixed(2)}" Tonality="${xmlEsc(keyVal)}" Comments="Energy ${t.energy}/10" Location="file://localhost/Users/Music/${fileName}" />`;
      }).join('\n');

      const playlistEntries = exportTracks.map((_, i) => `        <TRACK Key="${i + 1}" />`).join('\n');

      const xml = `<?xml version="1.0" encoding="UTF-8"?>
<DJ_PLAYLISTS Version="1.0.0">
  <PRODUCT Name="rekordbox" Version="6.8.0" Company="AlphaTheta" />
  <COLLECTION Entries="${exportTracks.length}">
${collectionNodes}
  </COLLECTION>
  <PLAYLISTS>
    <NODE Type="0" Name="ROOT" Count="1">
      <NODE Name="VNTEX Constellation Set" Type="1" KeyType="0" Entries="${exportTracks.length}">
${playlistEntries}
      </NODE>
    </NODE>
  </PLAYLISTS>
</DJ_PLAYLISTS>`;

      const blob = new Blob([xml], { type: 'application/xml' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'VNTEX_Rekordbox_Crate.xml';
      a.click();
    }

    function exportSeratoM3u8() {
      const exportTracks = voidState.setlistIds.length
        ? voidState.setlistIds.map((id) => voidState.tracks.find((t) => t.id === id)).filter(Boolean)
        : voidState.tracks.filter((t) => !t.missingData);
      if (!exportTracks.length) return;

      const lines = ['#EXTM3U', '#EXTENC:UTF-8', '#PLAYLIST:VNTEX Constellation Set'];
      exportTracks.forEach((t) => {
        const keyVal = voidState.keyMode === 'camelot' ? t.camelot : t.standard;
        lines.push(`#EXTINF:240,${t.artist} - ${t.title} [${t.bpm} BPM • ${keyVal} • E${t.energy}]`);
        lines.push(t.fileName || `${t.artist} - ${t.title}.mp3`);
      });

      const blob = new Blob([lines.join('\n')], { type: 'audio/x-mpegurl' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'VNTEX_Serato_Crate.m3u8';
      a.click();
    }

    /**************************************************************************
     * 8. DEMO GALAXY SEEDER (45 TRACKS INCLUDING UNSCANNED TRACKS)
     **************************************************************************/
    function seed45TrackGalaxy() {
      const artists = ['Uno', 'DJ Uno & Dave', 'VNTEX DSP', 'Plains Collective', 'Kaytranada Dub', 'Chris Lake VIP', 'Fred again.. Edit', 'Skream Dub'];
      const wordsA = ['Obsidian', 'Midnight', 'SubZero', 'Velvet', 'Neon', 'Solaris', 'Hyperdrive', 'Warehouse', 'Afterhours', 'Cyber', ' Mirage', 'Kinetic', 'Bassline', 'Gravity', 'Eclipse'];
      const wordsB = ['Telemetry', 'VIP', 'Dub', 'Groove', 'Flip', 'Edit', 'Stems', 'Anthem', 'Roller', 'Protocol', 'Session', 'Bounce', 'Transmission'];

      for (let i = 0; i < 45; i++) {
        const isMissing = i >= 37; // Last 8 tracks simulate un-tagged files needing DSP scan
        const kEntry = CAMELOT_MAP[(i * 3) % CAMELOT_MAP.length];
        const bpm = 120 + ((i * 5) % 14);
        const energy = 5 + (i % 5);
        const genre = GENRE_POOL[i % GENRE_POOL.length];
        const title = `${wordsA[i % wordsA.length]} ${wordsB[(i * 2) % wordsB.length]} ${i + 1}`;
        const artist = artists[i % artists.length];

        const track = assignTrackPhysics({
          id: 'demo_' + Math.random().toString(36).slice(2, 10),
          title,
          artist,
          fileName: `${artist} - ${title}.mp3`,
          bpm: isMissing ? 0 : bpm,
          camelot: isMissing ? '' : kEntry.camelot,
          standard: isMissing ? '' : kEntry.standard,
          energy: isMissing ? 0 : energy,
          genre: isMissing ? '' : genre,
          missingData: isMissing
        }, voidState.tracks.length);

        voidState.tracks.push(track);
      }

      if (!voidState.anchorId && voidState.tracks.length) {
        voidState.anchorId = voidState.tracks[0].id;
      }
      saveVoidState();
      refreshHudViews();
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /**************************************************************************
     * 9. INITIALIZATION & CANVAS INTERACTION
     **************************************************************************/
    document.addEventListener('DOMContentLoaded', () => {
      // Sync user & converted tracks from VNTEX Converter
      if (voidState.user && voidState.user.email) {
        document.getElementById('userStatusName').textContent = voidState.user.displayName || voidState.user.email;
        document.getElementById('userStatusIcon').className = 'fa-solid fa-circle-check text-emerald-400 text-[10px]';
        document.getElementById('userVerifiedBadge').classList.toggle('hidden', !voidState.user.verifiedBadge);
        document.getElementById('headerAdminDashLink').classList.toggle('hidden', !voidState.user.permissions?.isAdmin);
      }

      const savedCrate = JSON.parse(localStorage.getItem(STORAGE_KEYS.VOID_CRATE) || '[]');
      if (savedCrate.length) {
        voidState.tracks = savedCrate.map((t, i) => assignTrackPhysics(t, i));
      }

      // Also pull any newly converted tracks from index.html history
      const convHistory = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
      convHistory.forEach((h, i) => {
        if (!voidState.tracks.some((t) => t.title === h.trackTitle && t.artist === h.artist)) {
          const kEntry = lookupKeyEntry(h.key) || CAMELOT_MAP[7];
          voidState.tracks.push(assignTrackPhysics({
            id: 'conv_' + Math.random().toString(36).slice(2, 9),
            title: h.trackTitle || 'Converted Track',
            artist: h.artist || 'VNTEX User',
            fileName: `${h.artist} - ${h.trackTitle}.${(h.outputFormat || 'mp3').toLowerCase()}`,
            bpm: Number(h.bpm) || 126,
            camelot: kEntry.camelot,
            standard: kEntry.standard,
            energy: 7,
            genre: 'Electronic',
            missingData: false
          }, i));
        }
      });

      if (voidState.tracks.length === 0) {
        seed45TrackGalaxy();
      } else {
        if (!voidState.anchorId) voidState.anchorId = voidState.tracks[0].id;
        refreshHudViews();
      }

      startVoidLoop();

      // Canvas Pan, Zoom & Star Click Selection
      const canvas = document.getElementById('constellationCanvas');

      canvas.addEventListener('mousedown', (e) => {
        voidState.isDragging = true;
        voidState.dragMoved = false;
        voidState.dragStartX = e.clientX - voidState.camX;
        voidState.dragStartY = e.clientY - voidState.camY;
      });

      window.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (voidState.isDragging) {
          const nx = e.clientX - voidState.dragStartX;
          const ny = e.clientY - voidState.dragStartY;
          if (Math.hypot(nx - voidState.camX, ny - voidState.camY) > 4) voidState.dragMoved = true;
          voidState.camX = nx;
          voidState.camY = ny;
          return;
        }

        let closest = null, minDist = 18;
        voidState.tracks.forEach((t) => {
          const d = Math.hypot((t.screenX || 0) - mx, (t.screenY || 0) - my);
          if (d < minDist) { minDist = d; closest = t; }
        });
        voidState.hoveredId = closest ? closest.id : null;
        canvas.style.cursor = closest ? 'pointer' : 'grab';
      });

      window.addEventListener('mouseup', (e) => {
        if (!voidState.isDragging) return;
        voidState.isDragging = false;
        if (!voidState.dragMoved && voidState.hoveredId) {
          if (e.shiftKey) {
            if (!voidState.setlistIds.includes(voidState.hoveredId)) voidState.setlistIds.push(voidState.hoveredId);
          }
          voidState.anchorId = voidState.hoveredId;
          saveVoidState();
          refreshHudViews();
        }
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        voidState.zoom = Math.max(0.35, Math.min(3.5, voidState.zoom * factor));
      }, { passive: false });

      // Parameter Filter Toggle Pills
      document.querySelectorAll('[data-toggle-param]').forEach((btn) => {
        btn.onclick = () => {
          const p = btn.getAttribute('data-toggle-param');
          voidState.activeParams[p] = !voidState.activeParams[p];
          btn.classList.toggle(`active-${p}`, voidState.activeParams[p]);
          refreshHudViews();
        };
      });

      // Cycle BPM Tolerance (±3, ±5, ±8, ±12)
      const tols = [3, 5, 8, 12];
      document.getElementById('cycleBpmTolBtn').onclick = (e) => {
        const next = tols[(tols.indexOf(voidState.bpmTolerance) + 1) % tols.length];
        voidState.bpmTolerance = next;
        e.currentTarget.textContent = `±${next} BPM`;
        document.getElementById('bpmTolLabel').textContent = `±${next}`;
        refreshHudViews();
      };

      // Cycle Key Notation (Camelot vs Standard)
      document.getElementById('cycleKeyModeBtn').onclick = (e) => {
        voidState.keyMode = voidState.keyMode === 'camelot' ? 'standard' : 'camelot';
        e.currentTarget.textContent = voidState.keyMode.toUpperCase();
        refreshHudViews();
      };

      // File / Folder Drop & Selection
      const fileIn = document.getElementById('batchFileInput');
      const folderIn = document.getElementById('batchFolderInput');
      document.getElementById('addFilesBtn').onclick = () => fileIn.click();
      document.getElementById('addFolderBtn').onclick = () => folderIn.click();
      fileIn.onchange = (e) => ingestMassiveFileBatch(e.target.files);
      folderIn.onchange = (e) => ingestMassiveFileBatch(e.target.files);

      const dropZone = document.getElementById('voidDropContainer');
      const dragOverlay = document.getElementById('dragOverlay');
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.remove('hidden'); });
      dropZone.addEventListener('dragleave', (e) => { if (e.target === dropZone) dragOverlay.classList.add('hidden'); });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dragOverlay.classList.add('hidden');
        ingestMassiveFileBatch(e.dataTransfer.files);
      });

      document.getElementById('seedGalaxyBtn').onclick = seed45TrackGalaxy;
      document.getElementById('analyzeMissingBtn').onclick = analyzeAllMissingTracks;

      document.getElementById('analyzeSingleAnchorBtn').onclick = () => {
        const a = voidState.tracks.find((t) => t.id === voidState.anchorId);
        if (!a) return;
        populateSyntheticFallbackAnalysis(a, 1);
        const { tx, ty } = computeTargetVoidPosition(a, 1);
        a.tx = tx; a.ty = ty;
        saveVoidState();
        refreshHudViews();
      };

      document.getElementById('chainAnchorBtn').onclick = () => {
        if (voidState.anchorId && !voidState.setlistIds.includes(voidState.anchorId)) {
          voidState.setlistIds.push(voidState.anchorId);
          saveVoidState();
          refreshHudViews();
        }
      };

      // Quick Song Search Input
      const searchIn = document.getElementById('trackSearchInput');
      const searchDrop = document.getElementById('searchDropdownList');
      searchIn.oninput = () => {
        const q = searchIn.value.trim().toLowerCase();
        if (!q) { searchDrop.classList.add('hidden'); return; }
        const hits = voidState.tracks.filter(
          (t) => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q) || (t.genre || '').toLowerCase().includes(q)
        ).slice(0, 12);

        if (!hits.length) {
          searchDrop.innerHTML = `<div class="p-2 text-[10px] font-mono-tech text-[var(--text-muted)]">No matching tracks</div>`;
        } else {
          searchDrop.innerHTML = hits.map((t) => `
            <button type="button" data-pick-search="${t.id}" class="w-full text-left px-2.5 py-1.5 rounded-lg hover:bg-white/10 flex items-center justify-between text-[11px]">
              <span class="font-bold text-white truncate">${escapeHtml(t.title)}</span>
              <span class="font-mono-tech text-[10px] text-[var(--accent-primary)] shrink-0 ml-2">${t.missingData ? '?' : t.bpm}</span>
            </button>
          `).join('');
          searchDrop.querySelectorAll('[data-pick-search]').forEach((b) => {
            b.onclick = () => {
              selectAnchorAndCenter(b.getAttribute('data-pick-search'));
              searchDrop.classList.add('hidden');
              searchIn.value = '';
            };
          });
        }
        searchDrop.classList.remove('hidden');
      };

      // Drawer Tabs
      const tabMatches = document.getElementById('drawerTabMatchesBtn');
      const tabSet = document.getElementById('drawerTabSetlistBtn');
      const paneMatches = document.getElementById('drawerMatchesPane');
      const paneSet = document.getElementById('drawerSetlistPane');

      tabMatches.onclick = () => {
        tabMatches.className = 'py-1.5 rounded-lg font-bold bg-[#141522] text-[var(--accent-primary)]';
        tabSet.className = 'py-1.5 rounded-lg font-bold text-[var(--text-secondary)]';
        paneMatches.classList.remove('hidden');
        paneSet.classList.add('hidden');
      };
      tabSet.onclick = () => {
        tabSet.className = 'py-1.5 rounded-lg font-bold bg-[#141522] text-rose-400';
        tabMatches.className = 'py-1.5 rounded-lg font-bold text-[var(--text-secondary)]';
        paneSet.classList.remove('hidden');
        paneMatches.classList.add('hidden');
      };

      document.getElementById('toggleSetDrawerBtn').onclick = () => {
        document.getElementById('setlistDrawer').classList.toggle('hidden');
      };

      document.getElementById('recenterVoidBtn').onclick = () => {
        voidState.camX = 0; voidState.camY = 0; voidState.zoom = 1.0;
      };

      document.getElementById('clearVoidBtn').onclick = () => {
        voidState.tracks = [];
        voidState.setlistIds = [];
        voidState.anchorId = null;
        saveVoidState();
        refreshHudViews();
      };

      document.getElementById('clearSetlistBtn').onclick = () => {
        voidState.setlistIds = [];
        saveVoidState();
        refreshHudViews();
      };

      document.getElementById('exportRekordboxXmlBtn').onclick = exportRekordboxXml;
      document.getElementById('exportSeratoM3uBtn').onclick = exportSeratoM3u8;
    });
  </script>
</body>
</html>
